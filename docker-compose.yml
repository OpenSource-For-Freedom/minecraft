services:
  minecraft:
  ##### WITH MODS
    build:
      context: .
      dockerfile: Dockerfile
    image: minecraft-java:secure
    container_name: minecraft-java
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
    init: true
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4.0"
          pids: 512
        reservations:
          memory: 4g
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "25565:25565"            # Minecraft (public)
      - "24454:24454/udp"        # Simple Voice Chat (public)
      - "127.0.0.1:8100:8100"    # BlueMap — localhost only; front with a TLS reverse proxy
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "LATEST"
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        spark
        iris
        luckperms
        styled-chat
        bluemap?
        chunky
        simple-voice-chat
        origins?
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"
      DIFFICULTY: "easy"
      MODE: "creative"
      MOTD: "SUPER_SECRET_SERVER"
      MAX_PLAYERS: "20"
      ONLINE_MODE: "TRUE"
      PVP: "true"
      VIEW_DISTANCE: "20"
      SIMULATION_DISTANCE: "10"
      SEED: "1691256543523180978"
      TZ: "America/New_York"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
