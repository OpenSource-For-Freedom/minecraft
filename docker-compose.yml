services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-java
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "8100:8100"        # BlueMap web viewer
      - "24454:24454/udp"  # Simple Voice Chat
    environment:
      # Accept the Minecraft EULA
      EULA: "TRUE"
      # Let itzg pick the latest stable Java automatically
      TYPE: "FABRIC"
      VERSION: "LATEST"
      # Auto-download mods from Modrinth (one per line; ? = optional/skip if incompatible)
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        spark
        iris
        luckperms
        styled-chat
        bluemap?
        chunky
        simple-voice-chat
        origins?
      # Auto-download required mod dependencies
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      # RAM allocation - adjust MAX_MEMORY for your machine
      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"
      # Server settings
      DIFFICULTY: "easy"
      MODE: "creative"
      MOTD: "SUPER_SECRET_SERVER"
      MAX_PLAYERS: "20"
      ONLINE_MODE: "TRUE"
      PVP: "true"
      VIEW_DISTANCE: "20"
      SIMULATION_DISTANCE: "10"
      # World Generation Seed (Huge Cherry Blossom at spawn)
      SEED: "1691256543523180978"
      # Timezone for logs
      TZ: "America/New_York"
    volumes:
      # Persist world data and config on the host
      - ./data:/data
    stdin_open: true
    tty: true
