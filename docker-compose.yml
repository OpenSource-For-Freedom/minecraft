services:
  minecraft:
  ##### WITH MODS
    build:
      context: .
      dockerfile: Dockerfile
    image: minecraft-java:secure
    container_name: minecraft-java
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
    init: true
    stop_grace_period: 120s
    # Service-level resource limits: enforced by plain (non-swarm) Compose,
    # unlike a deploy.resources block. pids_limit caps processes (fork-bomb
    # guard); it can't live alongside a deploy.resources.limits block without
    # Compose flagging a phantom pids conflict.
    mem_limit: 6g
    mem_reservation: 4g
    cpus: 2.0
    pids_limit: 512
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "25565:25565"            # Minecraft (public)
      - "8100:8100"              # BlueMap web map — open http://SERVER_IP:8100 in a browser
                                 # (also open port 8100 in your host/cloud firewall)
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"          # best Forge mod support; do NOT bump without re-checking mods
      # The shared mods, by exact Modrinth CDN url — the SAME jars the client
      # pack (data/EduCraftClient.mrpack) installs, so client and server run
      # byte-identical versions. Client-only mods (Xaero's) are intentionally
      # absent here. itzg's MODRINTH_MODPACK doesn't read a local .mrpack in this
      # image, so we list the jars directly. To refresh after changing the pack:
      # read each file's downloads[0] from the pack's modrinth.index.json where
      # env.server != "unsupported", and join with commas.
      MODS: "https://cdn.modrinth.com/data/LNytGWDc/versions/8amzvn9x/create-1.20.1-6.0.8.jar,https://cdn.modrinth.com/data/gu7yAYhd/versions/rx9gr1rz/cc-tweaked-1.20.1-forge-1.120.0.jar,https://cdn.modrinth.com/data/fXt291FO/versions/yxrimuPr/cccbridge-mc1.20.1-v1.7.1-forge.jar,https://cdn.modrinth.com/data/SOw6jD6x/versions/mIP0ApJY/AdvancedPeripherals-1.20.1-0.7.48r.jar,https://cdn.modrinth.com/data/R2OftAxM/versions/CsjS7EkP/FarmersDelight-1.20.1-1.3.2.jar,https://cdn.modrinth.com/data/WFwYiVoG/versions/Jo8EwiDR/letsdo-bakery-forge-1.1.15.jar,https://cdn.modrinth.com/data/1DWmBJVA/versions/2I4cH49O/letsdo-vinery-forge-1.4.41.jar,https://cdn.modrinth.com/data/wvMc8AJt/versions/eAALa47O/lightmanscurrency-1.20.1-2.3.0.5.jar,https://cdn.modrinth.com/data/LOpKHB2A/versions/sKoHLGbK/waystones-forge-1.20.1-14.1.20.jar,https://cdn.modrinth.com/data/SaCpeal4/versions/gBDsc134/comforts-forge-6.4.0%2B1.20.1.jar,https://cdn.modrinth.com/data/nU0bVIaL/versions/94dtOLgZ/Patchouli-1.20.1-85-FORGE.jar,https://cdn.modrinth.com/data/u6dRKJwZ/versions/vnxhddW4/jei-1.20.1-forge-15.20.0.133.jar,https://cdn.modrinth.com/data/lhGA9TYQ/versions/1MKTLiiG/architectury-9.2.14-forge.jar,https://cdn.modrinth.com/data/4XJZeZbM/versions/uEaTMht9/letsdo-API-forge-1.2.15-forge.jar,https://cdn.modrinth.com/data/MBAkmtvl/versions/8rz04Kha/balm-forge-1.20.1-7.3.38-all.jar,https://cdn.modrinth.com/data/umyGl7zF/versions/g5igndAv/kubejs-forge-2001.6.5-build.16.jar,https://cdn.modrinth.com/data/sk9knFPE/versions/maCpsT70/rhino-forge-2001.2.3-build.6.jar,https://cdn.modrinth.com/data/ordsPcFz/versions/Zsh14XeQ/kotlinforforge-4.12.0-all.jar,https://cdn.modrinth.com/data/zfbCkvdZ/versions/er56DwLJ/Kambrik-6.1.1%2B1.20.1-forge.jar,https://cdn.modrinth.com/data/BpwWFOVM/versions/EM7Su3PD/Bountiful-6.0.4%2B1.20.1-forge.jar,https://cdn.modrinth.com/data/oydE75bY/versions/bLT6TveT/mythicalac-forge-1.20.1-1.0.0.jar"
      # Questify (quests) was removed: it and PrismProtect both shade their own
      # copy of org.sqlite as plain classes under the same package name, which
      # Forge's module system refuses to load together ("Modules questory and
      # prismprotect export package org.sqlite to module profanity") - a hard
      # crash before any mod even loads, not fixable by config. Kept PrismProtect
      # since block/chest rollback logging is a safety feature.
      # mythicalac (anticheat, server-only) is pinned by URL above, NOT listed in
      # MODRINTH_PROJECTS below: every published version is tagged beta/alpha, and
      # itzg's MODRINTH_PROJECTS only accepts "release" by default, so it failed
      # every boot with "No candidate versions ... matched versionType=release"
      # and crash-looped the container. Pinning the exact jar sidesteps that filter.
      # Server-only admin/safety mods, not in the player pack:
      # prismprotect = CoreProtect-style block/chest logging + rollback,
      # playtimestatistics = per-player playtime shown in the tab list.
      # (WatchDog, Ledger, and "Simple Playtime Tracker" from the idea sheet
      # have no Forge 1.20.1 build on Modrinth; these are the closest maintained
      # equivalents, found via the Modrinth API.)
      MODRINTH_PROJECTS: "luckperms,profanityguard,bluemap,prismprotect,playtimestatistics"
      # Wipe mods not in the lists above on each boot, so version bumps replace
      # cleanly instead of leaving a stale jar behind (a classic mismatch cause).
      REMOVE_OLD_MODS: "TRUE"
      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"
      # PrismProtect's sqlite-jdbc can't locate its own bundled native lib
      # under Forge's per-mod module classloader and throws
      # NativeLibraryNotFoundException, leaving its DB connection null and
      # crashing the server on the next DB write (e.g. a mob dying). The
      # Dockerfile bakes the identical native lib into the image; point
      # sqlite-jdbc straight at it, skipping its broken jar lookup.
      JVM_OPTS: "-Dorg.sqlite.lib.path=/opt/sqlite-native -Dorg.sqlite.lib.name=libsqlitejdbc.so"
      DIFFICULTY: "easy"
      MODE: "survival"
      MOTD: "Safe Kids Server"

      # --- KID-SAFETY: only approved players can join ---
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"          # kicks anyone removed from the whitelist immediately
      OPS: "Melfonz1960"                 # your Minecraft username = the only admin
      # WHITELIST: add kids' usernames here comma-separated, e.g. "kid1,kid2,friend1"
      WHITELIST: ""

      # --- KID-SAFETY: lock down risky gameplay ---
      PVP: "false"                       # no attacking each other
      ENABLE_COMMAND_BLOCK: "false"      # no redstone command-block exploits
      FORCE_GAMEMODE: "true"             # everyone stays in survival, even after an op-changed session
      SPAWN_PROTECTION: "16"             # kids can't grief the spawn area
      ALLOW_FLIGHT: "false"              # survival players shouldn't fly; keeps MythicalAC's fly-hack check meaningful

      MAX_PLAYERS: "20"
      ONLINE_MODE: "TRUE"               # Java accounts only (blocks cracked/anonymous clients)
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      TZ: "America/New_York"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
