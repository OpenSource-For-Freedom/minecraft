services:
  minecraft:
  ##### WITH MODS
    build:
      context: .
      dockerfile: Dockerfile
    image: minecraft-java:secure
    container_name: minecraft-java
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
    init: true
    stop_grace_period: 120s
    # Cap processes at the service level (deploy.resources.limits.pids is
    # swarm-only and rejected by non-swarm Compose).
    pids_limit: 512
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "4.0"
        reservations:
          memory: 4g
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "25565:25565"            # Minecraft (public)
      - "127.0.0.1:8100:8100"    # BlueMap — localhost only; front with a TLS reverse proxy
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"          # best Forge mod support; do NOT bump without re-checking mods
      # One pack for client and server. This is the SAME file players install on
      # their client; per-file env flags make the server skip client-only mods
      # (Xaero's), so client and server always run identical mod versions.
      MODRINTH_MODPACK: "/data/EduCraftClient.mrpack"
      # Server-only admin mods, not part of the player pack. Added on top of it.
      MODRINTH_PROJECTS: "luckperms,profanityguard,bluemap"
      # Keep the world/config when you update the pack; only replace mods.
      MODRINTH_EXCLUDE_FILES: ""
      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"
      DIFFICULTY: "easy"
      MODE: "creative"
      MOTD: "Safe Kids Server"

      # --- KID-SAFETY: only approved players can join ---
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"          # kicks anyone removed from the whitelist immediately
      OPS: "Melfonz1960"                 # your Minecraft username = the only admin
      # WHITELIST: add kids' usernames here comma-separated, e.g. "kid1,kid2,friend1"
      WHITELIST: ""

      # --- KID-SAFETY: lock down risky gameplay ---
      PVP: "false"                       # no attacking each other
      ENABLE_COMMAND_BLOCK: "false"      # no redstone command-block exploits
      FORCE_GAMEMODE: "true"             # everyone stays in the set gamemode
      SPAWN_PROTECTION: "16"             # kids can't grief the spawn area
      ALLOW_FLIGHT: "true"              # required for creative

      MAX_PLAYERS: "20"
      ONLINE_MODE: "TRUE"               # Java accounts only (blocks cracked/anonymous clients)
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      TZ: "America/New_York"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
