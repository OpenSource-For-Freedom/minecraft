services:
  minecraft:
  ##### WITH MODS
    build:
      context: .
      dockerfile: Dockerfile
    image: minecraft-java:secure
    container_name: minecraft-java
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
    init: true
    stop_grace_period: 120s
    # Service-level resource limits: enforced by plain (non-swarm) Compose,
    # unlike a deploy.resources block. pids_limit caps processes (fork-bomb
    # guard); it can't live alongside a deploy.resources.limits block without
    # Compose flagging a phantom pids conflict.
    mem_limit: 6g
    mem_reservation: 4g
    # Raised from 2.0 when the droplet went from 2 to 4 vCPUs (2026-08-07).
    # This cap, not the droplet size, is what actually limits the server: the
    # container sat pegged at ~197% of 2 cores during worldgen, and leaving
    # this at 2.0 would have made the resize buy exactly nothing.
    # 3.5, not 4.0: the host still needs cycles for sshd/tailscaled, auditd,
    # the deploy timer and Docker itself. Handing the whole box to the JVM
    # makes the admin plane unresponsive precisely when the server is busy,
    # which is when you most need to get in.
    cpus: 3.5
    pids_limit: 512
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "25565:25565"            # Minecraft (public)
      - "127.0.0.1:8100:8100"    # BlueMap web map — localhost only; view it through an
                                 # SSH tunnel (ssh -L 8100:localhost:8100 root@SERVER_IP),
                                 # never open 8100 in the cloud firewall
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"          # best Forge mod support; do NOT bump without re-checking mods
      # The shared mods, by exact Modrinth CDN url — the SAME jars the client
      # pack (data/EduCraftClient.mrpack) installs, so client and server run
      # byte-identical versions. Client-only mods (Xaero's) are intentionally
      # absent here. itzg's MODRINTH_MODPACK doesn't read a local .mrpack in this
      # image, so we list the jars directly. To refresh after changing the pack:
      # read each file's downloads[0] from the pack's modrinth.index.json where
      # env.server != "unsupported", and join with commas.
      MODS: "https://cdn.modrinth.com/data/LNytGWDc/versions/8amzvn9x/create-1.20.1-6.0.8.jar,https://cdn.modrinth.com/data/gu7yAYhd/versions/rx9gr1rz/cc-tweaked-1.20.1-forge-1.120.0.jar,https://cdn.modrinth.com/data/fXt291FO/versions/yxrimuPr/cccbridge-mc1.20.1-v1.7.1-forge.jar,https://cdn.modrinth.com/data/SOw6jD6x/versions/mIP0ApJY/AdvancedPeripherals-1.20.1-0.7.48r.jar,https://cdn.modrinth.com/data/R2OftAxM/versions/CsjS7EkP/FarmersDelight-1.20.1-1.3.2.jar,https://cdn.modrinth.com/data/WFwYiVoG/versions/Jo8EwiDR/letsdo-bakery-forge-1.1.15.jar,https://cdn.modrinth.com/data/1DWmBJVA/versions/2I4cH49O/letsdo-vinery-forge-1.4.41.jar,https://cdn.modrinth.com/data/wvMc8AJt/versions/eAALa47O/lightmanscurrency-1.20.1-2.3.0.5.jar,https://cdn.modrinth.com/data/LOpKHB2A/versions/sKoHLGbK/waystones-forge-1.20.1-14.1.20.jar,https://cdn.modrinth.com/data/SaCpeal4/versions/gBDsc134/comforts-forge-6.4.0%2B1.20.1.jar,https://cdn.modrinth.com/data/nU0bVIaL/versions/94dtOLgZ/Patchouli-1.20.1-85-FORGE.jar,https://cdn.modrinth.com/data/u6dRKJwZ/versions/vnxhddW4/jei-1.20.1-forge-15.20.0.133.jar,https://cdn.modrinth.com/data/lhGA9TYQ/versions/1MKTLiiG/architectury-9.2.14-forge.jar,https://cdn.modrinth.com/data/4XJZeZbM/versions/uEaTMht9/letsdo-API-forge-1.2.15-forge.jar,https://cdn.modrinth.com/data/MBAkmtvl/versions/8rz04Kha/balm-forge-1.20.1-7.3.38-all.jar,https://cdn.modrinth.com/data/umyGl7zF/versions/g5igndAv/kubejs-forge-2001.6.5-build.16.jar,https://cdn.modrinth.com/data/sk9knFPE/versions/maCpsT70/rhino-forge-2001.2.3-build.6.jar,https://cdn.modrinth.com/data/ordsPcFz/versions/Zsh14XeQ/kotlinforforge-4.12.0-all.jar,https://cdn.modrinth.com/data/zfbCkvdZ/versions/er56DwLJ/Kambrik-6.1.1%2B1.20.1-forge.jar,https://cdn.modrinth.com/data/BpwWFOVM/versions/EM7Su3PD/Bountiful-6.0.4%2B1.20.1-forge.jar,https://cdn.modrinth.com/data/Vebnzrzj/versions/AudvOzqV/LuckPerms-Forge-5.4.102.jar,https://cdn.modrinth.com/data/w55UhnTf/versions/lkx1EGgV/Profanity%20Guard-forge-1.20.1-1.1.0.jar,https://cdn.modrinth.com/data/swbUV1cr/versions/kC7iYqja/bluemap-5.12-mc1.20-6-forge.jar,https://cdn.modrinth.com/data/FIpr9lji/versions/LcBh53eF/prismprotect-forge-1.3.2-mc1.20.1-1.20.4.jar,https://cdn.modrinth.com/data/rsBa8ErW/versions/l7p4hUk0/playtimestatistics-1.20.x-zh-CN-1.0.1.jar,https://cdn.modrinth.com/data/8oi3bsk5/versions/WeYhEb5d/Terralith_1.20.x_v2.5.4.jar,https://cdn.modrinth.com/data/fALzjamp/versions/4FTDk9wv/Chunky-1.3.146.jar"
      # Questify (quests) was removed: it and PrismProtect both shade their own
      # copy of org.sqlite as plain classes under the same package name, which
      # Forge's module system refuses to load together ("Modules questory and
      # prismprotect export package org.sqlite to module profanity") - a hard
      # crash before any mod even loads, not fixable by config. Kept PrismProtect
      # since block/chest rollback logging is a safety feature.
      # mythicalac (anticheat) was REMOVED 2026-08-02. It kicked a whitelisted
      # player for opening a door: the Phase check escalated vl 13 to 25 on
      # ordinary movement, and Step false-flagged an op just walking. The mod
      # ships no config file and never generates one, so no threshold could be
      # raised and no player could be exempted; the only lever was uninstalling
      # it. Its jar is 60KB with 16 classes, every published build is tagged
      # beta/alpha (which is why it could never be fetched by project name), and
      # it logs nothing server-side, so there was no audit trail to review.
      # It also protected against a threat this server does not have: the
      # whitelist is enforced and PvP is off, so there are no untrusted players.
      # Do not re-add an anticheat without a config file, ops exemption, and
      # server-side logging. See issue #8.
      # Terralith (worldgen) is server_side=required, client_side=optional on
      # Modrinth, so it is NOT in the player pack: the server generates the
      # terrain and clients render it without needing the jar. Nobody has to
      # re-import the modpack. One jar covers fabric/forge/neoforge/quilt, and
      # the version pinned above lists forge + 1.20.1 explicitly.
      # NOTE: worldgen only affects chunks generated AFTER this deploys. The
      # existing explored world is unchanged, and there will be a visible seam
      # where old terrain meets new. Travel out to see it.
      # Chunky (worldgen pre-generation) is an ADMIN TOOL, not gameplay. It is
      # server-only and does nothing until an op runs a command, so it is not
      # in the player pack and players never see it.
      # Why it is here: exploring generates chunks on the fly, in competition
      # with the tick loop for the same cores, which is what made travel feel
      # slow after Terralith landed. Chunky builds those chunks in advance so
      # exploring later costs nothing. Run it when nobody is playing:
      #   docker exec minecraft-java rcon-cli chunky radius 3000
      #   docker exec minecraft-java rcon-cli chunky start
      #   docker exec minecraft-java rcon-cli chunky pause     # before players join
      #   docker exec minecraft-java rcon-cli chunky continue  # resume later
      # It checkpoints to disk, so a restart resumes rather than starting over.
      # Pre-generation permanently grows the world save: roughly 1 GB per
      # 1500-block radius in the overworld. The droplet has ~148 GB free, so a
      # 3000 radius is comfortable, but do not set 20000 casually.
      # Server-only admin/safety mods, not in the player pack:
      # prismprotect = CoreProtect-style block/chest logging + rollback,
      # playtimestatistics = per-player playtime shown in the tab list.
      # (WatchDog, Ledger, and "Simple Playtime Tracker" from the idea sheet
      # have no Forge 1.20.1 build on Modrinth; these are the closest maintained
      # equivalents, found via the Modrinth API.)
      # MODRINTH_PROJECTS is deliberately NOT used. It resolved luckperms,
      # profanityguard, bluemap, prismprotect and playtimestatistics by NAME,
      # which means "whatever is the latest release at container start". With
      # REMOVE_OLD_MODS=TRUE below, any restart silently swapped those five jars
      # for whatever upstream had published since - including, if a maintainer
      # account were ever compromised, a malicious build. Nobody would have been
      # notified, and the audit trail would show a normal restart.
      # All 26 mods are now pinned to an exact immutable version URL in MODS
      # above, so the mod set can only change through a reviewed commit that
      # passes CI. Updating one is a deliberate act: find the new version on
      # Modrinth, replace its URL, and let the deploy gate verify the build.
      # Wipe mods not in the list above on each boot, so version bumps replace
      # cleanly instead of leaving a stale jar behind (a classic mismatch cause).
      REMOVE_OLD_MODS: "TRUE"
      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"
      # PrismProtect's sqlite-jdbc can't locate its own bundled native lib
      # under Forge's per-mod module classloader and throws
      # NativeLibraryNotFoundException, leaving its DB connection null and
      # crashing the server on the next DB write (e.g. a mob dying). The
      # Dockerfile bakes the identical native lib into the image; point
      # sqlite-jdbc straight at it, skipping its broken jar lookup.
      JVM_OPTS: "-Dorg.sqlite.lib.path=/opt/sqlite-native -Dorg.sqlite.lib.name=libsqlitejdbc.so"
      DIFFICULTY: "easy"
      MODE: "survival"
      # The MOTD is broadcast to anyone who pings the port, including every
      # internet-wide scanner that indexes Minecraft servers. "Safe Kids Server"
      # advertised to strangers that children play here, which is exactly the
      # audience you do not want to attract. EduCraft says nothing about who is
      # on it. The safety controls are the whitelist and online-mode, not the label.
      MOTD: "EduCraft §7Education and Adventure"

      # --- KID-SAFETY: only approved players can join ---
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"          # kicks anyone removed from the whitelist immediately
      OPS: "Melfonz1960"                 # your Minecraft username = the only admin
      # WHITELIST: add kids' usernames here comma-separated, e.g. "kid1,kid2,friend1"
      WHITELIST: ""

      # --- KID-SAFETY: lock down risky gameplay ---
      PVP: "false"                       # no attacking each other
      ENABLE_COMMAND_BLOCK: "false"      # no redstone command-block exploits
      FORCE_GAMEMODE: "true"             # everyone stays in survival, even after an op-changed session
      SPAWN_PROTECTION: "16"             # kids can't grief the spawn area
      ALLOW_FLIGHT: "false"              # survival players shouldn't fly; keeps MythicalAC's fly-hack check meaningful

      MAX_PLAYERS: "20"
      ONLINE_MODE: "TRUE"               # Java accounts only (blocks cracked/anonymous clients)
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "8"
      TZ: "America/New_York"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
