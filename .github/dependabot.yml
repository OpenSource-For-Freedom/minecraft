version: 2

# Weekly dependency updates (Mondays 04:00 UTC), grouped to keep PR volume
# low. Patch/minor + dev-dependency PRs are auto-merged once CI is green by
# .github/workflows/dependabot-auto-merge.yml; major bumps are labelled
# "needs-manual-review" and left for a human.
updates:
  # ── npm (frontend + build tooling) ────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-ecosystem:
        patterns:
          - "java"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ── pip (Python data pipeline) ────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ml-stack:
        patterns:
          - "scikit-learn"
          - "numpy"
          - "pandas"
          - "scipy"
          - "xgboost"
      pipeline-deps:
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
