# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: trivy

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '27 5 * * 3'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build an image from Dockerfile
        # Same tag the compose service builds, so what is scanned here is what
        # the droplet runs. The starter template's docker.io/my-organization/
        # my-app placeholder was never edited and scanned an image name that
        # means nothing to anyone reading the results.
        run: |
          docker build -t minecraft-java:secure .

      - name: Run Trivy vulnerability scanner
        # Pinned by commit, and KEEP IT CURRENT. This was pinned to
        # 7b7aa264 for years, which is the SHA the GitHub starter workflow
        # shipped with on 2022-06-22 - a four-year-old scanner action being
        # handed modern options like `scanners:`. A stale security scanner
        # reports stale results, which is worse than no scanner because the
        # green check still looks like assurance.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'minecraft-java:secure'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # The scan was failing with "analyze error: timeout: context deadline
          # exceeded", not on findings. This image carries a full JDK plus the
          # Forge runtime, and the default 5m analysis window is not enough.
          timeout: '20m'
          # Report only what can actually be acted on. The base image is already
          # pinned to upstream's newest build, so CVEs with no available fix are
          # upstream's to ship and produce alerts with no remediation path. A
          # dashboard full of un-actionable findings is one that stops being read.
          ignore-unfixed: true
          # Vulnerability scanning only. Secret scanning walks every file in
          # every layer, which is the bulk of the time here and is already
          # covered for this repo by the committed-token check in ci.yml.
          scanners: 'vuln'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: 'trivy-results.sarif'
