name: zizmor

# Static analysis of the GitHub Actions workflows themselves. Blocking: a new
# workflow that unpins an action, leaks a credential through a persisted
# checkout, or opens a template-injection sink fails this gate before it can
# merge. Policy lives in .github/zizmor.yml.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.30.1 --min-severity medium .github/workflows/
