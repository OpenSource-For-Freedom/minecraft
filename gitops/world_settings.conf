# World settings the repo owns but that live in the world SAVE, not in
# docker-compose.yml, so nothing else in the repo would ever set them.
# apply_world_settings.sh applies this after every healthy deploy.
#
# One KEY="value" per line, parsed (not sourced) by the script. Change a value
# here through a PR; do not change it in game, because the next deploy puts it
# back. That is the point: the repo is the source of truth.

# World spawn point, "X Y Z". Players with no bed spawn here.
SPAWN="587 98 87"
